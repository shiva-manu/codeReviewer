name: Code review on push

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  commit-statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shiva-manu/codeReviewer@v1
        with:
          opencode-api-key: ${{ secrets.OPENCODE_API_KEY }}
